<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eye Plates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg: #03080d; --panel: rgba(8, 24, 34, .75); --line: #0e7490; --cyan: #22d3ee; --red: #f43f5e; --text: #cffafe; --dim: #6b9aa8; --plate: #facc15; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #0a2230, var(--bg) 60%); color: var(--text); font: 14px "Share Tech Mono", ui-monospace, monospace; letter-spacing: .04em; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1, h2 { font-family: Orbitron, sans-serif; margin: 0; text-transform: uppercase; color: var(--cyan); text-shadow: 0 0 8px rgba(34, 211, 238, .7); }
  h1 { font-size: 18px; letter-spacing: .3em; }
  h2 { font-size: 12px; letter-spacing: .2em; margin-bottom: 10px; }
  #status { flex: 1; color: var(--dim); text-transform: uppercase; }
  #status.err { color: var(--red); }
  button, label.src, a.src { font: inherit; color: var(--cyan); background: transparent; border: 1px solid var(--cyan); padding: 6px 14px; cursor: pointer; text-transform: uppercase; letter-spacing: .15em; text-decoration: none; }
  button:disabled { opacity: .4; cursor: default; }
  #run[aria-pressed="false"] { color: var(--dim); border-color: var(--dim); text-decoration: line-through; }
  label.src input { position: absolute; opacity: 0; width: 1px; }
  label.src:has(input:focus-visible), button:focus-visible, a.src:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--line); padding: 12px; }
  canvas { width: 100%; display: block; }
  .k { color: var(--dim); }
  .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid rgba(14, 116, 144, .4); }
  th { color: var(--dim); font-weight: normal; text-transform: uppercase; font-size: 12px; }
  td.plate { font-family: Orbitron, sans-serif; color: var(--plate); letter-spacing: .12em; }
  video { display: none; }
</style>
</head>
<body>
<header>
  <h1>Eye // Plates</h1>
  <span id="status" aria-live="polite">Loading models…</span>
  <button id="run" aria-pressed="true" title="Pause or resume plate reading">Reading</button>
  <button id="cam" disabled>Camera</button>
  <label class="src">Video file<input id="file" type="file" accept="video/*" disabled></label>
  <a class="src" href="index.html">← Eye</a>
</header>
<main>
  <section class="panel">
    <h2>View // plate detection</h2>
    <canvas id="view"></canvas>
    <p class="k" id="perf"></p>
  </section>
  <section class="panel">
    <h2>Plates // <span id="count">0</span></h2>
    <div class="row"><span class="k">A plate is listed after 3 matching readings. Saved in this browser only.</span>
      <span><button id="csv" disabled>⤓ CSV</button> <button id="clear">Clear</button></span></div>
    <table><thead><tr><th>Plate</th><th>First seen</th><th>Last seen</th><th>Passes</th></tr></thead><tbody id="list"></tbody></table>
  </section>
</main>
<video id="video" autoplay playsinline muted></video>
<script type="module">
import { decodePlateBoxes, readPlates, makePlateList, tiles, mergeBoxes } from "./plates.js";
const ORT = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist", DET = 640, OCR_W = 128, OCR_H = 64, STORE = "eye-plates";
const $ = id => document.getElementById(id), status = $("status"), video = $("video"), view = $("view"), ctx = view.getContext("2d");
const fail = msg => { status.textContent = `Error: ${msg}`; status.className = "err"; };

// Plates are kept between visits, only in this browser (blocked storage just means the list starts empty).
const plates = makePlateList();
try { plates.load(JSON.parse(localStorage.getItem(STORE) ?? "[]")); } catch {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(plates.list())); } catch {} };
const time = t => new Date(t).toLocaleString();
function render() {
  const rows = plates.list();
  $("count").textContent = rows.length;
  $("csv").disabled = !rows.length;
  $("list").innerHTML = rows.map(e => `<tr><td class="plate">${e.plate}</td><td>${time(e.first)}</td><td>${time(e.last)}</td><td>${e.passes}</td></tr>`).join("")
    || `<tr><td colspan="4" class="k">No plates yet</td></tr>`;
}
render();
$("clear").onclick = () => { if (confirm("Delete every saved plate?")) { plates.clear(); save(); render(); } };
$("csv").onclick = async () => {
  const { toCsv } = await import("./classify.js");
  const csv = toCsv([["plate", "first_seen", "last_seen", "passes", "confidence"], ...plates.list().map(e => [e.plate, new Date(e.first).toISOString(), new Date(e.last).toISOString(), e.passes, e.conf.toFixed(2)])]);
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([csv], { type: "text/csv" })), download: `eye-plates-${new Date().toISOString().replace(/[:.]/g, "-")}.csv` });
  a.click(); URL.revokeObjectURL(a.href);
};
let reading = true, seen = []; // seen: this scan's plates {box, text, conf}
const setReading = on => { reading = on; seen = []; status.className = ""; $("run").setAttribute("aria-pressed", on); };
$("run").onclick = () => setReading(!reading);

try {
  const ort = await import(`${ORT}/ort.webgpu.min.mjs`);
  ort.env.wasm.wasmPaths = `${ORT}/`;
  // Graphics card first, then CPU; the warm-up run proves the backend really works for this model.
  async function open(file, feeds) {
    for (const ep of navigator.gpu ? ["webgpu", "wasm"] : ["wasm"]) {
      try { const s = await ort.InferenceSession.create(file, { executionProviders: [ep] }); await s.run(feeds()); return s; }
      catch (e) { console.warn(`${file}: ${ep} unavailable`, e); }
    }
    throw new Error(`can't start ${file} on this device`);
  }
  const detInput = data => ({ images: new ort.Tensor("float32", data, [1, 3, DET, DET]) });
  const ocrInput = (data, n) => ({ input: new ort.Tensor("uint8", data, [n, OCR_H, OCR_W, 3]) });
  status.textContent = "Loading plate detector…";
  const detector = await open("models/plate-detector.onnx", () => detInput(new Float32Array(3 * DET * DET)));
  status.textContent = "Loading plate reader…";
  const reader = await open("models/plate-ocr.onnx", () => ocrInput(new Uint8Array(OCR_H * OCR_W * 3), 1));

  const detCv = Object.assign(document.createElement("canvas"), { width: DET, height: DET }), dctx = detCv.getContext("2d", { willReadFrequently: true });
  const ocrCv = Object.assign(document.createElement("canvas"), { width: OCR_W, height: OCR_H }), octx = ocrCv.getContext("2d", { willReadFrequently: true });
  let W = 0, H = 0, busy = false, scanMs = 0, source = 0;

  // One frame frozen per scan: the models take a while, and a moving car would leave the box before its plate is cropped.
  const frameCv = document.createElement("canvas"), fctx = frameCv.getContext("2d");
  // Finds plates in one tile of the frozen frame: letterboxed to 640×640 (grey bars, as the detector was trained).
  async function detect({ sx, sy, sw, sh }) {
    const scale = Math.min(DET / sw, DET / sh), padX = (DET - sw * scale) / 2, padY = (DET - sh * scale) / 2;
    dctx.fillStyle = "rgb(114,114,114)"; dctx.fillRect(0, 0, DET, DET);
    dctx.drawImage(frameCv, sx, sy, sw, sh, padX, padY, sw * scale, sh * scale);
    const px = dctx.getImageData(0, 0, DET, DET).data, N = DET * DET, input = new Float32Array(3 * N);
    for (let i = 0; i < N; i++) { input[i] = px[i * 4] / 255; input[N + i] = px[i * 4 + 1] / 255; input[2 * N + i] = px[i * 4 + 2] / 255; }
    return decodePlateBoxes((await detector.run(detInput(input))).output0.data, { scale, padX, padY }).map(b => ({ ...b, x: b.x + sx, y: b.y + sy }));
  }
  // One scan: find plates in each tile (two overlapping halves, so far plates stay big enough), read them all in one batch.
  async function scan() {
    const t0 = performance.now();
    if (frameCv.width !== W || frameCv.height !== H) { frameCv.width = W; frameCv.height = H; }
    fctx.drawImage(video, 0, 0, W, H);
    const all = [];
    for (const t of tiles(W, H)) all.push(...await detect(t));
    const boxes = mergeBoxes(all)
      .map(b => { const x = Math.max(0, b.x), y = Math.max(0, b.y); return { ...b, x, y, w: Math.min(W, b.x + b.w) - x, h: Math.min(H, b.y + b.h) - y }; })
      .filter(b => b.w > 4 && b.h > 2);
    let found = [];
    if (boxes.length) {
      const batch = new Uint8Array(boxes.length * OCR_H * OCR_W * 3);
      boxes.forEach((b, n) => { // each plate stretched to 128×64 RGB, as the reader was trained
        octx.drawImage(frameCv, b.x, b.y, b.w, b.h, 0, 0, OCR_W, OCR_H);
        const d = octx.getImageData(0, 0, OCR_W, OCR_H).data;
        for (let i = 0; i < OCR_W * OCR_H; i++) for (let c = 0; c < 3; c++) batch[(n * OCR_W * OCR_H + i) * 3 + c] = d[i * 4 + c];
      });
      const texts = readPlates((await reader.run(ocrInput(batch, boxes.length))).plate.data);
      found = boxes.map((box, i) => ({ box, ...texts[i] }));
      const now = Date.now();
      if (found.map(f => plates.read(f.text, f.conf, now)).some(Boolean)) { save(); render(); }
    }
    scanMs = scanMs ? 0.8 * scanMs + 0.2 * (performance.now() - t0) : performance.now() - t0;
    return found;
  }

  async function useSource(setup) {
    video.srcObject?.getTracks().forEach(t => t.stop());
    video.srcObject = null; video.removeAttribute("src");
    await setup(); source++; seen = []; status.className = "";
    await video.play();
  }
  const startCamera = () => useSource(async () => {
    status.textContent = "Waiting for camera… (allow access in the browser bar)";
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 1920, height: 1080, facingMode: "environment" } }); // far plates need every pixel; cameras without 1080p give their best
  });
  $("cam").onclick = () => startCamera().catch(e => fail(e.message));
  $("file").onchange = e => { const f = e.target.files[0]; if (f) useSource(async () => { video.src = URL.createObjectURL(f); video.loop = true; }).catch(err => fail(`can't play this video (${err.message})`)); };
  $("cam").disabled = $("file").disabled = false;
  await startCamera().catch(e => fail(e.message));

  (function loop() {
    if (video.videoWidth && (video.videoWidth !== W || video.videoHeight !== H)) { W = view.width = video.videoWidth; H = view.height = video.videoHeight; }
    if (W && video.readyState >= 2) {
      ctx.drawImage(video, 0, 0, W, H); // not mirrored: plates must read the right way round
      ctx.lineWidth = 3; ctx.font = "bold 22px Orbitron, sans-serif";
      for (const { box: b, text, conf } of seen) {
        ctx.strokeStyle = ctx.fillStyle = "#facc15"; ctx.strokeRect(b.x, b.y, b.w, b.h);
        if (text) ctx.fillText(`${text} ${Math.round(conf * 100)}%`, b.x, Math.max(22, b.y - 8));
      }
      if (reading && !busy) {
        busy = true;
        const src = source;
        scan().then(f => { if (src === source && reading) seen = f; }, e => { console.error(e); setReading(false); fail(`plate reading failed (${e.message})`); })
          .finally(() => { busy = false; });
      }
      if (status.className !== "err") status.textContent = reading ? "Online · reading plates" : "Paused";
      $("perf").textContent = scanMs ? `${Math.round(scanMs)} ms per scan` : "";
    }
    requestAnimationFrame(loop);
  })();
} catch (e) { fail(e.message); }
</script>
</body>
</html>
