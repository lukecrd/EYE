<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg: #03080d; --panel: rgba(8, 24, 34, .75); --line: #0e7490; --cyan: #22d3ee; --red: #f43f5e; --text: #cffafe; --dim: #6b9aa8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #0a2230, var(--bg) 60%); color: var(--text); font: 14px "Share Tech Mono", ui-monospace, monospace; letter-spacing: .04em; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(34, 211, 238, .035) 0 1px, transparent 1px 3px); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); box-shadow: 0 1px 12px rgba(34, 211, 238, .15); }
  h1, h2 { font-family: Orbitron, sans-serif; margin: 0; text-transform: uppercase; color: var(--cyan); text-shadow: 0 0 8px rgba(34, 211, 238, .7); }
  h1 { font-size: 18px; letter-spacing: .3em; }
  h2 { font-size: 12px; letter-spacing: .2em; margin-bottom: 10px; }
  #status { flex: 1; color: var(--dim); text-transform: uppercase; }
  #status.err { color: var(--red); }
  #clock { color: var(--dim); }
  button { font: inherit; color: var(--red); background: transparent; border: 1px solid var(--red); padding: 6px 14px; cursor: pointer; text-transform: uppercase; letter-spacing: .15em; box-shadow: inset 0 0 8px rgba(244, 63, 94, .35); }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--red); color: #fff; }
  .src { color: var(--cyan); border-color: var(--cyan); box-shadow: inset 0 0 8px rgba(34, 211, 238, .3); }
  label.src { font: inherit; padding: 6px 14px; border: 1px solid; cursor: pointer; text-transform: uppercase; letter-spacing: .15em; }
  label.src input { position: absolute; opacity: 0; width: 1px; }
  label.src:has(input:focus-visible), button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
  .col { display: grid; gap: 16px; align-content: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); padding: 12px; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
  canvas { width: 100%; display: block; }
  .readout { margin-top: 12px; display: grid; gap: 8px; }
  .card { border-left: 2px solid var(--cyan); padding: 6px 10px; background: rgba(34, 211, 238, .05); }
  .row { display: flex; justify-content: space-between; gap: 12px; text-transform: uppercase; }
  .k { color: var(--dim); }
  .big { font-family: Orbitron, sans-serif; font-size: 20px; text-shadow: 0 0 10px currentColor; }
  .bar { height: 5px; background: rgba(34, 211, 238, .1); margin: 3px 0 6px; }
  .bar i { display: block; height: 100%; box-shadow: 0 0 8px currentColor; }
  video { display: none; }
</style>
</head>
<body>
<header>
  <h1>Eye</h1>
  <span id="status" aria-live="polite">Loading models…</span>
  <span id="clock"></span>
  <button id="cam" class="src" disabled>Camera</button>
  <label class="src">Video file<input id="file" type="file" accept="video/*" disabled></label>
  <button id="rec" disabled>● Rec</button>
</header>
<main>
  <section class="panel">
    <h2>Body // limb tracking</h2>
    <canvas id="body"></canvas>
    <div id="bodyOut" class="readout"></div>
  </section>
  <div class="col">
    <section class="panel">
      <h2>Face // expression analysis</h2>
      <canvas id="face" width="480" height="480"></canvas>
      <div id="faceOut" class="readout"></div>
    </section>
    <section class="panel">
      <h2>Objects // detection</h2>
      <div id="objOut" class="readout"></div>
    </section>
  </div>
</main>
<video id="video" autoplay playsinline muted></video>
<script type="module">
const CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14", MODELS = "https://storage.googleapis.com/mediapipe-models";
const WINDOW_MS = 1500, PEOPLE_COLOR = "#a78bfa", PERSON_COLORS = ["#22d3ee", "#60a5fa", "#e879f9", "#facc15"], LIMB_COLORS = ["#22d3ee", "#f472b6", "#a3e635", "#fbbf24"];
const EXPR_COLORS = { Smiling: "#a3e635", Threatening: "#f43f5e", Surprised: "#fbbf24", Sad: "#60a5fa", Neutral: "#22d3ee" };
const TORSO = [[11, 12], [12, 24], [24, 23], [23, 11]].map(([start, end]) => ({ start, end }));
const $ = id => document.getElementById(id);
const video = $("video"), bodyCv = $("body"), faceCv = $("face"), status = $("status"), recBtn = $("rec");
const plain = ctx => ctx.setTransform(1, 0, 0, 1, 0, 0);
let mirrored = true; // webcam is shown like a mirror; video files are shown as recorded
const view = (ctx, w) => mirrored ? ctx.setTransform(-1, 0, 0, 1, w, 0) : plain(ctx);

// Corner brackets around a box, the HUD frame (whole canvas by default).
function hudFrame(ctx, w, h, color, { x0 = 0, y0 = 0, m = 10, s = 28 } = {}) {
  plain(ctx); ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.shadowColor = color; ctx.shadowBlur = 8; ctx.beginPath();
  for (const [x, y, dx, dy] of [[x0 + m, y0 + m, 1, 1], [x0 + w - m, y0 + m, -1, 1], [x0 + m, y0 + h - m, 1, -1], [x0 + w - m, y0 + h - m, -1, -1]]) {
    ctx.moveTo(x, y + dy * s); ctx.lineTo(x, y); ctx.lineTo(x + dx * s, y);
  }
  ctx.stroke(); ctx.shadowBlur = 0;
}
function hudText(ctx, text, x, y, color, font = "14px 'Share Tech Mono', monospace", align = "left") {
  plain(ctx); ctx.font = font; ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 6; ctx.textAlign = align;
  ctx.fillText(text, x, y); ctx.shadowBlur = 0; ctx.textAlign = "left";
}

try {
  // Browsers block loading classify.js from file://, which used to leave the page silently stuck.
  if (location.protocol === "file:") throw new Error("don't open index.html directly. Double-click start.bat (or run: node server.mjs) and use http://localhost:8080");
  // Dynamic imports so a failed download shows an error instead of hanging.
  const { PoseLandmarker, FaceLandmarker, ObjectDetector, FilesetResolver, DrawingUtils } = await import(CDN);
  const { classifyPose, classifyMotion, motion, makeRepCounter, makeTracker, limbStates, classifyExpression, summarizeObjects, makeBoxTracker } = await import("./classify.js");
  const bctx = bodyCv.getContext("2d"), fctx = faceCv.getContext("2d"), bdraw = new DrawingUtils(bctx), fdraw = new DrawingUtils(fctx);

  const vision = await FilesetResolver.forVisionTasks(`${CDN}/wasm`);
  // GPU first; some phones and old PCs can't run it, so fall back to CPU instead of failing.
  const load = async (Task, model, opts) => {
    for (const delegate of ["GPU", "CPU"]) {
      try { return await Task.createFromOptions(vision, { baseOptions: { modelAssetPath: `${MODELS}/${model}`, delegate }, runningMode: "VIDEO", ...opts }); }
      catch (e) { if (delegate === "CPU") throw e; }
    }
  };
  status.textContent = "Loading body model…";
  const pose = await load(PoseLandmarker, "pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", { numPoses: PERSON_COLORS.length });
  status.textContent = "Loading face model…";
  const face = await load(FaceLandmarker, "face_landmarker/face_landmarker/float16/1/face_landmarker.task", { numFaces: 1, outputFaceBlendshapes: true });
  status.textContent = "Loading object model…";
  // maxResults is high so crowds get counted; people are split from the other objects below.
  const objects = await load(ObjectDetector, "object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite", { scoreThreshold: 0.5, maxResults: 30 });

  const FS = faceCv.width, expr = {}, recCv = document.createElement("canvas"), rctx = recCv.getContext("2d");
  let W = 0, H = 0, track, people, rec = null, frames = 0, fpsT = performance.now(), tick = 0, found = [], crowd = [];
  const X = px => mirrored ? W - px : px; // video pixel x → screen x

  // Switches the analysed source; trackers restart so ids and counts belong to the new source.
  async function useSource(setup, isCamera) {
    video.srcObject?.getTracks().forEach(t => t.stop());
    video.srcObject = null; video.removeAttribute("src");
    await setup();
    mirrored = isCamera; track = makeTracker(); people = makeBoxTracker(); found = []; crowd = [];
    status.textContent = "Starting video…";
    await video.play();
  }
  const startCamera = () => useSource(async () => {
    status.textContent = "Waiting for camera… (allow access in the browser bar)";
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 960, height: 540, facingMode: "user" } });
  }, true);
  $("cam").onclick = () => startCamera().catch(e => { status.textContent = `Error: ${e.message}`; });
  $("file").onchange = e => {
    const f = e.target.files[0];
    if (f) useSource(async () => { video.src = URL.createObjectURL(f); video.loop = true; }, false)
      .catch(err => { status.textContent = `Error: can't play this video (${err.message})`; });
  };
  await startCamera();
  $("cam").disabled = $("file").disabled = false;

  function drawBody(now, res) {
    view(bctx, W); bctx.drawImage(video, 0, 0, W, H);
    plain(bctx); bctx.fillStyle = "rgba(3, 12, 18, .45)"; bctx.fillRect(0, 0, W, H); // dim the video so overlays stand out
    for (const d of found) {
      const { originX, originY, width, height } = d.boundingBox, x = Math.min(X(originX), X(originX + width)), c = d.categories[0];
      hudFrame(bctx, width, height, "#fbbf24", { x0: x, y0: originY, m: 0, s: Math.min(20, width / 3, height / 3) });
      hudText(bctx, `${c.categoryName.toUpperCase()} ${Math.round(c.score * 100)}%`, x, Math.max(14, originY - 6), "#fbbf24");
    }
    for (const t of crowd) {
      const { x: bx, y, w, h } = t.box, x = Math.min(X(bx), X(bx + w));
      hudFrame(bctx, w, h, PEOPLE_COLOR, { x0: x, y0: y, m: 0, s: Math.min(24, w / 3, h / 3) });
      hudText(bctx, `ID ${t.id} · ${Math.round(t.score * 100)}%`, x + 4, y + h - 8, PEOPLE_COLOR);
    }
    hudText(bctx, `PEOPLE ${crowd.length} · TOTAL ${people.total()}`, W - 50, 36, PEOPLE_COLOR, "bold 16px Orbitron, sans-serif", "right");
    const cards = [`<div class="card" style="border-color:${PEOPLE_COLOR}"><div class="row"><span>People in frame <b style="color:${PEOPLE_COLOR}">${crowd.length}</b></span><span class="k">Total seen ${people.total()}</span></div></div>`];
    for (const p of track(res.landmarks, now)) {
      p.hist ??= []; p.speed ??= 0;
      p.squats ??= makeRepCounter("Squat", "Standing"); p.jumps ??= makeRepCounter("Jumping");
      p.speed = 0.8 * p.speed + 0.2 * motion(p.hist.at(-1)?.lm, p.lm); // smoothed so jitter doesn't flip the label
      p.hist.push({ t: now, lm: p.lm });
      while (now - p.hist[0].t > WINDOW_MS) p.hist.shift();

      const posture = classifyPose(p.lm), move = classifyMotion(p.hist), label = move ?? posture;
      const squats = p.squats(posture), jumps = p.jumps(move), limbs = limbStates(p.lm);
      const color = PERSON_COLORS[(p.id - 1) % PERSON_COLORS.length];
      // Skeletons take the id of the person box around their hips, so both views agree.
      const hx = (p.lm[23].x + p.lm[24].x) / 2 * W, hy = (p.lm[23].y + p.lm[24].y) / 2 * H;
      const id = crowd.find(t => hx >= t.box.x && hx <= t.box.x + t.box.w && hy >= t.box.y && hy <= t.box.y + t.box.h)?.id ?? "?";

      view(bctx, W);
      bdraw.drawConnectors(p.lm, TORSO, { color: "rgba(207, 250, 254, .55)", lineWidth: 2 });
      limbs.forEach((l, i) => {
        if (l.visible) bdraw.drawConnectors(p.lm, [{ start: l.ids[0], end: l.ids[1] }, { start: l.ids[1], end: l.ids[2] }], { color: LIMB_COLORS[i], lineWidth: 4 });
      });
      bdraw.drawLandmarks(p.lm.slice(11), { color: "#cffafe", radius: 2.5 }); // body joints only; the face has its own panel
      limbs.forEach((l, i) => {
        const j = p.lm[l.ids[1]];
        if (l.visible) hudText(bctx, `${l.deg}°`, X(j.x * W) + 8, j.y * H, LIMB_COLORS[i]);
      });
      hudText(bctx, `#${id} ${label.toUpperCase()}`, X(p.lm[0].x * W) - 50, Math.max(28, p.lm[0].y * H - 40), color, "bold 16px Orbitron, sans-serif");

      cards.push(`<div class="card" style="border-color:${color}">
        <div class="row"><span>#${id} <b style="color:${color}">${label}</b></span><span class="k">${p.speed > 0.01 ? "Moving" : "Still"} · Squats ${squats} · Jumps ${jumps}</span></div>
        ${limbs.map((l, i) => `<div class="row"><span style="color:${LIMB_COLORS[i]}">${l.name}</span><span>${l.visible ? l.deg + "°" : "--"} ${l.state}</span></div>`).join("")}
      </div>`);
    }
    hudFrame(bctx, W, H, "#22d3ee");
    $("bodyOut").innerHTML = cards.join("");
  }

  function drawFace(res) {
    plain(fctx); fctx.fillStyle = "#03080d"; fctx.fillRect(0, 0, FS, FS);
    const lm = res.faceLandmarks[0];
    if (!lm) {
      hudFrame(fctx, FS, FS, "#6b9aa8");
      hudText(fctx, "NO FACE LOCK", FS / 2 - 70, FS / 2, "#6b9aa8", "bold 18px Orbitron, sans-serif");
      $("faceOut").innerHTML = `<div class="k">Face the camera</div>`;
      return;
    }
    // Square crop around the face, padded, so it fills the panel.
    let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
    for (const q of lm) { x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x); y1 = Math.max(y1, q.y); }
    const size = Math.max((x1 - x0) * W, (y1 - y0) * H) * 1.4, sx = (x0 + x1) / 2 * W - size / 2, sy = (y0 + y1) / 2 * H - size / 2;
    view(fctx, FS); fctx.drawImage(video, sx, sy, size, size, 0, 0, FS, FS);
    plain(fctx); fctx.fillStyle = "rgba(3, 12, 18, .5)"; fctx.fillRect(0, 0, FS, FS);

    const local = lm.map(q => ({ x: (q.x * W - sx) / size, y: (q.y * H - sy) / size }));
    view(fctx, FS);
    fdraw.drawConnectors(local, FaceLandmarker.FACE_LANDMARKS_TESSELATION, { color: "rgba(34, 211, 238, .12)", lineWidth: 1 });
    fdraw.drawConnectors(local, FaceLandmarker.FACE_LANDMARKS_FACE_OVAL, { color: "rgba(34, 211, 238, .6)", lineWidth: 1.5 });
    for (const k of ["LEFT_EYE", "RIGHT_EYE", "LEFT_IRIS", "RIGHT_IRIS", "LEFT_EYEBROW", "RIGHT_EYEBROW"])
      fdraw.drawConnectors(local, FaceLandmarker[`FACE_LANDMARKS_${k}`], { color: "#22d3ee", lineWidth: 2 });
    fdraw.drawConnectors(local, FaceLandmarker.FACE_LANDMARKS_LIPS, { color: "#f472b6", lineWidth: 2 });

    for (const c of res.faceBlendshapes[0]?.categories ?? []) // smoothed so the label doesn't flicker
      expr[c.categoryName] = 0.7 * (expr[c.categoryName] ?? c.score) + 0.3 * c.score;
    const e = classifyExpression(expr), col = EXPR_COLORS[e.label];
    hudFrame(fctx, FS, FS, col);
    hudText(fctx, e.label.toUpperCase(), 22, FS - 22, col, "bold 22px Orbitron, sans-serif");
    hudText(fctx, `EYES ${e.eyes.toUpperCase()} · MOUTH ${e.mouth.toUpperCase()}`, 22, 34, "#cffafe");

    $("faceOut").innerHTML = `
      <div class="row"><span class="k">Expression</span><span class="big" style="color:${col}">${e.label}</span></div>
      <div class="row"><span class="k">Eyes</span><span>${e.eyes}</span></div>
      <div class="row"><span class="k">Mouth</span><span>${e.mouth}</span></div>
      ${Object.entries(e.scores).map(([k, v]) => `<div><div class="row"><span>${k}</span><span>${Math.round(v * 100)}%</span></div>
        <div class="bar"><i style="width:${v * 100}%;background:${EXPR_COLORS[k]};color:${EXPR_COLORS[k]}"></i></div></div>`).join("")}`;
  }

  (function loop() {
    const now = performance.now();
    if (video.videoWidth && (video.videoWidth !== W || video.videoHeight !== H)) { // new source or resolution
      W = bodyCv.width = video.videoWidth; H = bodyCv.height = video.videoHeight;
      recCv.width = W + H; recCv.height = H;
    }
    if (!W || video.readyState < 2) return requestAnimationFrame(loop); // no frame to analyse yet
    drawBody(now, pose.detectForVideo(video, now));
    drawFace(face.detectForVideo(video, now));
    if (tick++ % 3 === 0) { // objects move slowly; every 3rd frame keeps three models smooth
      const all = objects.detectForVideo(video, now).detections, isPerson = d => d.categories[0].categoryName === "person";
      found = all.filter(d => !isPerson(d));
      crowd = people(all.filter(isPerson).map(({ boundingBox: b, categories: [c] }) => ({ x: b.originX, y: b.originY, w: b.width, h: b.height, score: c.score })));
      const list = summarizeObjects(found);
      $("objOut").innerHTML = list.map(o => `<div class="row"><span style="color:#fbbf24">${o.name}${o.count > 1 ? " ×" + o.count : ""}</span><span>${Math.round(o.best * 100)}%</span></div>`).join("")
        || `<div class="k">No objects detected</div>`;
    }
    if (rec) { rctx.drawImage(bodyCv, 0, 0); rctx.drawImage(faceCv, W, 0, H, H); }
    if (++frames, now - fpsT > 1000) {
      status.textContent = `Online · ${Math.round(frames * 1000 / (now - fpsT))} fps${rec ? " · recording" : ""}`;
      $("clock").textContent = new Date().toLocaleTimeString();
      frames = 0; fpsT = now;
    }
    requestAnimationFrame(loop);
  })();

  // Recording: both panels side by side → WebM file, downloaded when you press Stop.
  if (!window.MediaRecorder) recBtn.title = "Recording not supported in this browser";
  else {
    recBtn.disabled = false;
    recBtn.onclick = () => {
      if (rec) { rec.stop(); return; }
      const chunks = [];
      rec = new MediaRecorder(recCv.captureStream(30), { mimeType: "video/webm" });
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
        a.download = `eye-${new Date().toISOString().replace(/[:.]/g, "-")}.webm`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
        rec = null; recBtn.textContent = "● Rec"; recBtn.classList.remove("on");
      };
      rec.start(1000);
      recBtn.textContent = "■ Stop"; recBtn.classList.add("on");
    };
  }
} catch (e) {
  status.textContent = `Error: ${e.message}`;
  status.classList.add("err");
}
</script>
</body>
</html>
